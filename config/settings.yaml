      stop_perte: 0.08
      delai_max_heures: 6
      tolerance: 0.1
  - nom: Robot Kamikaze
    risque: extrême
    strategie: kamikaze
    parametres:
      part_numero_1: 0.7
      part_numero_2: 0.29
      stop_perte: 0.07
      securisation_des: 0.12
      securisation_recul: 0.05
      duree_min_heures: 20
      ecart_rotation: 3
      banni_heures: 48
      titre_crise: QQQS.MI
      pari_crise_heures: 48
      stop_crise: 0.1
      delai_max_heures: 3
